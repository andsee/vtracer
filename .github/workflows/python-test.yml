name: Python binding tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install maturin
        run: python -m pip install maturin
      - name: Build extension wheel
        run: maturin build --manifest-path crates/vtracer-py/Cargo.toml --release --out /tmp/vtracer-wheel
      - name: Install extension and run binding tests
        run: |
          python -m pip install /tmp/vtracer-wheel/*.whl
          python -B -m unittest discover -s crates/vtracer-py/tests -v
