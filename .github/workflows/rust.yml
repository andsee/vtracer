name: Rust

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  push:
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
    branches:
      - master
      - 0.*.x
      - ci-*

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test
        run: cargo test --workspace --verbose

  wasm:
    name: wasm-safety (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - name: Build core for wasm32
        run: cargo build --target wasm32-unknown-unknown -p vtracer

  nodejs:
    name: Node package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build & test
        working-directory: nodejs
        run: |
          wasm-pack build --target nodejs --out-dir pkg --no-opt
          node test.js

  browser:
    name: Browser WASM binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build browser package
        working-directory: nodejs
        run: wasm-pack build --target web --out-dir pkg-web --no-opt
      - name: Exercise binding in Chrome
        working-directory: nodejs
        run: |
          python3 -m http.server 8765 --directory .. > /tmp/vtracer-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/nodejs/browser-test.html >/dev/null; then
              break
            fi
            sleep 1
          done
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom \
            http://127.0.0.1:8765/nodejs/browser-test.html > /tmp/vtracer-browser-result.html
          grep -q '<pre id="result">BROWSER_BINDING_OK ' /tmp/vtracer-browser-result.html
          printf 'BROWSER_BINDING_OK\n' > pkg-web/browser-test-result.txt
          printf '%s\n' "$GITHUB_SHA" > pkg-web/candidate-sha.txt
      - name: Upload browser package and test result
        uses: actions/upload-artifact@v5
        with:
          name: vtracer-browser-wasm
          path: nodejs/pkg-web/
          if-no-files-found: error
