<!doctype html>
<meta charset="utf-8">
<title>VTracer browser binding test</title>
<pre id="result">BROWSER_BINDING_PENDING</pre>
<script type="module">
  import init, { vectorize_rgba } from './pkg-web/vtracer_wasm.js';

  const result = document.querySelector('#result');
  try {
    await init();
    const response = await fetch('../crates/vtracer/tests/fixtures/snowman-bow.pbm');
    if (!response.ok) throw new Error('failed to fetch raster fixture');
    const tokens = (await response.text())
      .replace(/#[^\n]*/g, '')
      .trim()
      .split(/\s+/);
    if (tokens[0] !== 'P1') throw new Error('expected a portable P1 raster');
    const width = Number(tokens[1]);
    const height = Number(tokens[2]);
    const pixels = new Uint8Array(width * height * 4);
    for (let i = 0; i < width * height; i++) {
      const value = tokens[i + 3] === '1' ? 0 : 255;
      pixels.set([value, value, value, 255], i * 4);
    }
    const options = {
      clustering: 'bw',
      filterSpeckle: 0,
      optimize: 0,
    };
    const legacy = vectorize_rgba(pixels, width, height, {
      ...options,
      cornerSupport: 0,
    });
    const supported = vectorize_rgba(pixels, width, height, {
      ...options,
      cornerSupport: 4,
    });
    if (!legacy.includes('<path') || !supported.includes('<path')) {
      throw new Error('browser binding returned invalid SVG');
    }
    const legacyCubics = (legacy.match(/C/g) || []).length;
    const supportedCubics = (supported.match(/C/g) || []).length;
    if (legacy === supported || legacyCubics <= supportedCubics) {
      throw new Error('positive corner support did not alter fitted geometry');
    }
    result.textContent = `BROWSER_BINDING_OK ${legacy.length}->${supported.length} bytes`;
  } catch (error) {
    result.textContent = `BROWSER_BINDING_FAILED ${error}`;
    throw error;
  }
</script>
